<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant - Government Schemes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #131314;
      --bg-sidebar: #1e1f20;
      --bg-surface: #1e1f20;
      --bg-surface-hover: #2d2e2f;
      --bg-input: #1e1f20;
      --text-primary: #e3e3e3;
      --text-secondary: #c4c7c5;
      --accent-blue: #8ab4f8;
      --accent-blue-hover: #aecbfa;
      --user-bubble: #282a2c;
      --bot-bubble: #004a77;
      --border-color: #444746;
      --sidebar-width: 280px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar Styles */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      padding: 16px;
      border-right: 1px solid var(--border-color);
      transition: transform 0.3s ease;
      z-index: 100;
      height: 100%;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: var(--bg-surface-hover);
      color: var(--text-secondary);
      border: 1px solid transparent;
      padding: 12px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      margin-bottom: 20px;
    }

    .new-chat-btn:hover {
      background-color: var(--bg-surface);
      color: var(--text-primary);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .history-item {
      padding: 10px 14px;
      border-radius: 18px;
      cursor: pointer;
      color: var(--text-primary);
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
      transition: background 0.2s;
    }

    .history-item:hover,
    .history-item.active {
      background-color: var(--bg-surface-hover);
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s, color 0.2s;
    }

    .history-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      background-color: rgba(255, 0, 0, 0.2);
      color: #ff6b6b;
    }

    .history-item.active {
      font-weight: 600;
    }

    /* Main Chat Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
    }

    .chat-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      /* border-bottom: 1px solid var(--border-color); */
    }

    .model-selector {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .model-selector strong {
      color: var(--text-primary);
    }

    /* Chat History/Messages Area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20% 40px 20%;
      /* Centered wide layout */
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .message {
      display: flex;
      gap: 16px;
      width: 100%;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .avatar.user {
      background-color: var(--user-bubble);
      color: var(--text-primary);
    }

    .avatar.bot {
      background: linear-gradient(135deg, var(--accent-blue) 0%, #1967d2 100%);
      color: white;
    }

    .message-content {
      flex: 1;
      line-height: 1.6;
      font-size: 16px;
      padding-top: 6px;
    }

    .message-content strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    .message-content a {
      color: var(--accent-blue);
      text-decoration: none;
    }

    .message-content a:hover {
      text-decoration: underline;
    }

    .loading-indicator {
      display: flex;
      gap: 5px;
      margin-top: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: scale(0);
      }

      40% {
        transform: scale(1);
      }
    }

    /* Input Area */
    .input-area {
      padding: 24px 20%;
      background-color: var(--bg-body);
    }

    .input-container {
      background-color: var(--bg-sidebar);
      border-radius: 28px;
      /* Capsule shape */
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid transparent;
      transition: border-color 0.3s, background-color 0.3s;
    }

    .input-container:focus-within {
      background-color: var(--bg-surface-hover);
      border-color: var(--border-color);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 16px;
      resize: none;
      font-family: 'Outfit', sans-serif;
      max-height: 150px;
      padding: 8px 0;
      height: 24px;
      /* Initial height */
      overflow-y: hidden;
    }

    textarea:focus {
      outline: none;
    }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: color 0.2s, background 0.2s;
    }

    .action-btn:hover {
      color: var(--text-primary);
      background-color: rgba(255, 255, 255, 0.1);
    }

    /* Formatted answer styles */
    .formatted-answer ul {
      margin-left: 20px;
      margin-bottom: 10px;
    }

    .formatted-answer p {
      margin-bottom: 12px;
    }

    .hidden {
      display: none !important;
    }

    /* Welcome Screen styles */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: var(--text-secondary);
      padding: 40px;
    }

    .welcome-screen h1 {
      font-size: 48px;
      background: linear-gradient(135deg, var(--accent-blue) 0%, #c58af9 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .suggestion-cards {
      display: flex;
      gap: 16px;
      margin-top: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background-color: var(--bg-surface);
      padding: 20px;
      border-radius: 12px;
      width: 180px;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid var(--border-color);
    }

    .card:hover {
      background-color: var(--bg-surface-hover);
    }

    .card p {
      font-size: 14px;
      color: var(--text-primary);
    }

    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        height: 100%;
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .chat-messages,
      .input-area {
        padding-left: 20px;
        padding-right: 20px;
      }

      .menu-btn {
        display: block;
      }
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <button class="new-chat-btn" onclick="startNewChat()">
      <span>+</span> New Chat
    </button>
    <div style="margin-top: 10px; padding-left: 12px; font-size: 12px; font-weight: 500; color: var(--text-secondary);">
      Recent</div>
    <ul class="history-list" id="history-list">
      <!-- History items injected here -->
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="chat-header">
      <div class="model-selector">
        <strong>GovSchemes</strong> Assistant
      </div>
    </div>

    <div class="chat-messages" id="chat-container">
      <!-- Welcome Screen (Default) -->
      <div class="welcome-screen" id="welcome-screen">
        <h1>Hello, User</h1>
        <p>How can I help you regarding government schemes today?</p>

        <div class="suggestion-cards">
          <div class="card" onclick="populateInput('Schemes for hearing impairment')">
            <p>Schemes for hearing impairment</p>
          </div>
          <div class="card" onclick="populateInput('How to apply for UDID card?')">
            <p>How to apply for UDID card?</p>
          </div>
          <div class="card" onclick="populateInput('Scholarship schemes for students')">
            <p>Scholarship schemes for students</p>
          </div>
        </div>
      </div>
      <!-- Messages will be injected here -->
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-container">
        <textarea id="user-input" placeholder="Ask anything about schemes..." rows="1"></textarea>

        <button class="action-btn" id="voice-btn" onclick="toggleVoice()" title="Voice Input">
          🎤
        </button>

        <button class="action-btn" id="send-btn" onclick="sendMessage()" title="Send">
          ➤
        </button>
      </div>
      <p style="font-size: 12px; color: var(--text-secondary); text-align: center; margin-top: 10px;">
        AI may display inaccurate info, including about people, so double-check its responses.
      </p>
    </div>
  </main>

  <script>
    // --- State Management ---
    const STORAGE_KEY = 'chat_sessions';
    let sessions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentSessionId = null;
    let recognition = null;
    let isListening = false;

    // --- DOM Elements ---
    const chatContainer = document.getElementById('chat-container');
    const welcomeScreen = document.getElementById('welcome-screen');
    const userInput = document.getElementById('user-input');
    const historyList = document.getElementById('history-list');
    const sendBtn = document.getElementById('send-btn');

    // --- Initialization ---
    window.addEventListener('DOMContentLoaded', () => {
      // Load latest session or start new
      renderHistory();
      if (sessions.length > 0) {
        loadSession(sessions[0].id);
      } else {
        startNewChat();
      }
      initVoice();
      userInput.focus();
    });

    // Auto-resize textarea
    userInput.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
      if (this.value === '') this.style.height = '24px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // --- Core Functions ---

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function startNewChat() {
      currentSessionId = generateId();
      const newSession = {
        id: currentSessionId,
        title: 'New Chat',
        timestamp: Date.now(),
        messages: []
      };
      sessions.unshift(newSession); // Add to top
      saveSessions();
      renderHistory();
      renderChat(newSession);
      userInput.focus();
    }

    function saveSessions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    }

    function loadSession(id) {
      currentSessionId = id;
      const session = sessions.find(s => s.id === id);
      if (session) {
        renderChat(session);
        // Update active state in sidebar
        document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
        const activeItem = document.querySelector(`[data-id="${id}"]`);
        if (activeItem) activeItem.classList.add('active');
      }
    }

    function deleteSession(e, id) {
      e.stopPropagation(); // Prevent loading the session
      sessions = sessions.filter(s => s.id !== id);
      saveSessions();
      renderHistory();
      if (currentSessionId === id) {
        if (sessions.length > 0) {
          loadSession(sessions[0].id);
        } else {
          startNewChat();
        }
      }
    }

    function updateSessionTitle(firstUserMessage) {
      const session = sessions.find(s => s.id === currentSessionId);
      if (session && session.title === 'New Chat') {
        session.title = firstUserMessage.length > 30 ? firstUserMessage.substring(0, 30) + '...' : firstUserMessage;
        saveSessions();
        renderHistory();
      }
    }

    function addMessageToSession(role, content) {
      const session = sessions.find(s => s.id === currentSessionId);
      if (session) {
        session.messages.push({ role, content });
        // Move session to top
        sessions = sessions.filter(s => s.id !== currentSessionId);
        sessions.unshift(session);
        saveSessions();
        renderHistory();
      }
    }

    // --- Rendering ---

    function renderHistory() {
      historyList.innerHTML = '';
      sessions.forEach(session => {
        const li = document.createElement('li');
        li.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
        li.dataset.id = session.id;
        li.onclick = () => loadSession(session.id);

        const titleSpan = document.createElement('span');
        titleSpan.innerText = session.title;
        titleSpan.style.overflow = 'hidden';
        titleSpan.style.textOverflow = 'ellipsis';
        titleSpan.style.whiteSpace = 'nowrap';
        titleSpan.style.flex = '1';

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.innerHTML = '🗑️';
        deleteBtn.title = 'Delete chat';
        deleteBtn.onclick = (e) => deleteSession(e, session.id);

        li.appendChild(titleSpan);
        li.appendChild(deleteBtn);
        historyList.appendChild(li);
      });
    }

    function renderChat(session) {
      // Clear chat area except welcome screen (we'll toggle visibility)
      chatContainer.innerHTML = '';
      chatContainer.appendChild(welcomeScreen);

      if (session.messages.length === 0) {
        welcomeScreen.classList.remove('hidden');
      } else {
        welcomeScreen.classList.add('hidden');
        session.messages.forEach(msg => appendMessageUI(msg.role, msg.content));
      }
    }

    function appendMessageUI(role, content) {
      welcomeScreen.classList.add('hidden');

      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';

      const avatar = document.createElement('div');
      avatar.className = `avatar ${role}`;
      avatar.innerHTML = role === 'user' ? '👤' : '🤖';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content formatted-answer';
      contentDiv.innerHTML = role === 'user' ? content : formatResponse(content);

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(contentDiv);

      chatContainer.appendChild(msgDiv);
      scrollToBottom();
    }

    function showLoading() {
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message loading-msg';
      loadingDiv.innerHTML = `
            <div class="avatar bot">🤖</div>
            <div class="message-content">
                <div class="loading-indicator">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        `;
      chatContainer.appendChild(loadingDiv);
      scrollToBottom();
      return loadingDiv;
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function populateInput(text) {
      userInput.value = text;
      userInput.focus();
      // Trigger height resize
      userInput.dispatchEvent(new Event('input'));
    }

    // --- Networking ---

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      // UI Updates
      userInput.value = '';
      userInput.style.height = '24px';
      appendMessageUI('user', text);
      addMessageToSession('user', text);
      updateSessionTitle(text); // Rename "New Chat" if needed

      const loadingEl = showLoading();

      try {
        // Use PROXY endpoint for Render compatibility
        // const apiHost = `http://${window.location.hostname}:8003`;
        const response = await fetch(`/proxy/chatbot/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: text })
        });

        const data = await response.json();
        chatContainer.removeChild(loadingEl);

        const answer = data.answer || "Sorry, I couldn't get a response.";
        appendMessageUI('bot', answer);
        addMessageToSession('bot', answer);

      } catch (error) {
        chatContainer.removeChild(loadingEl);
        appendMessageUI('bot', "Error connecting to server. Is backend running?");
        console.error(error);
      }
    }

    // --- Utilities ---

    function formatResponse(text) {
      if (!text) return "";
      let html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Markdown Links [text](url) -> <a>
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

      // **Bold** -> <strong>
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

      // Newlines -> <br> or <p> logic could go here. Simple approach:
      return html.replace(/\n/g, '<br>');
    }

    // --- Voice Input ---

    function initVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('voice-btn').style.display = 'none';
        return;
      }
      recognition = new SpeechRecognition();
      recognition.lang = 'en-IN';
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('voice-btn').style.color = 'var(--accent-blue)';
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('voice-btn').style.color = '';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        setTimeout(sendMessage, 500); // Auto-send
      };
    }

    function toggleVoice() {
      if (!recognition) return;
      if (isListening) recognition.stop();
      else recognition.start();
    }
  </script>
</body>

</html>
