<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ctrl-A</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #131314;
            --bg-surface: #1e1f20;
            --bg-surface-hover: #2d2e2f;
            --bg-input: #2d2e2f;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-blue: #8ab4f8;
            --accent-blue-hover: #aecbfa;
            --border-color: #444746;
            --error-color: #f2b8b5;
            --success-color: #81c995;
            --focus-ring: #a8c7fa;
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            background: var(--bg-surface);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .login-header {
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-body);
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-blue);
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .login-form {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.8rem;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            background-color: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.2);
        }

        .form-input::placeholder {
            color: #666;
        }

        .form-input.error {
            border-color: var(--error-color);
        }

        /* Password Toggle - Large Hit Area */
        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.5rem;
            border-radius: 50%;
        }

        .password-toggle:hover,
        .password-toggle:focus {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        /* Accessibile Checkbox */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }

        .checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-input);
            position: relative;
            cursor: pointer;
        }

        .checkbox:checked {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .checkbox:checked::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
        }

        .checkbox:focus-visible {
            outline: 2px solid var(--focus-ring);
            outline-offset: 2px;
        }

        .checkbox-label {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .forgot-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-family: 'Outfit', sans-serif;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: #000;
        }

        .btn-primary:hover {
            background-color: var(--accent-blue-hover);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(242, 184, 181, 0.1);
            color: var(--error-color);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            border: 1px solid var(--error-color);
            display: none;
            text-align: center;
        }

        .success-message {
            background: rgba(129, 201, 149, 0.1);
            color: var(--success-color);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            border: 1px solid var(--success-color);
            display: none;
            text-align: center;
        }

        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0, 0, 0, 0.3);
            border-top: 3px solid #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .back-link {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
            text-decoration: none;
        }

        .back-link:hover {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
        }

        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .signup-link a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--bg-surface);
            margin: 15% auto;
            padding: 2rem;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .close {
            background: none;
            border: none;
            font-size: 1.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s;
        }

        .close:hover {
            color: var(--text-primary);
        }

        /* High Visibility Focus */
        :focus-visible {
            outline: 3px solid var(--focus-ring);
            outline-offset: 4px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <a href="/landing" class="back-link" aria-label="Back to home">
            <i class="fas fa-arrow-left"></i>
        </a>

        <div class="login-header">
            <a href="/" class="logo">
                <i class="fas fa-universal-access"></i> Ctrl-A <span>Schemes</span>
            </a>
            <p class="login-subtitle">Sign in to access your portal</p>
        </div>

        <div class="login-form">
            <div class="error-message" id="errorMessage" role="alert"></div>
            <div class="success-message" id="successMessage" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email"
                        required autocomplete="email" aria-required="true">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" class="form-input"
                            placeholder="Enter your password" required autocomplete="current-password"
                            aria-required="true">
                        <button type="button" class="password-toggle" onclick="togglePassword()"
                            aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember" class="checkbox">
                        <span class="checkbox-label">Remember me</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="openForgotPassword()">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span class="loading" id="loading">
                        <div class="spinner"></div>
                        Signing in...
                    </span>
                    <span id="loginText">
                        Sign In <i class="fas fa-arrow-right"></i>
                    </span>
                </button>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="/signup">Create one here</a>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="forgotPasswordTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="forgotPasswordTitle">Reset Password</h3>
                <button class="close" onclick="closeForgotPassword()" aria-label="Close modal">&times;</button>
            </div>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="resetEmail" class="form-label">Email Address</label>
                    <input type="email" id="resetEmail" name="email" class="form-input" placeholder="Enter your email"
                        required>
                </div>
                <button type="submit" class="btn btn-primary" id="resetBtn">
                    <span class="loading" id="resetLoading">
                        <div class="spinner"></div>
                        Sending...
                    </span>
                    <span id="resetText">
                        Send Reset Link
                    </span>
                </button>
            </form>
        </div>
    </div>

    <script>
        // Password toggle functionality
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('passwordToggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Modal functions
        function openForgotPassword() {
            const modal = document.getElementById('forgotPasswordModal');
            modal.style.display = 'block';
            // Trap focus in modal
            const firstInput = document.getElementById('resetEmail');
            setTimeout(() => firstInput.focus(), 100);
        }

        function closeForgotPassword() {
            document.getElementById('forgotPasswordModal').style.display = 'none';
            document.getElementById('forgotPasswordForm').reset();
            // Return focus to trigger
            document.querySelector('.forgot-link').focus();
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            const modal = document.getElementById('forgotPasswordModal');
            if (event.target === modal) {
                closeForgotPassword();
            }
        }

        // Close modal on Escape key
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeForgotPassword();
            }
        });

        // Show/hide messages
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        // Show/hide loading state
        function setLoading(buttonId, loadingId, textId, isLoading) {
            const button = document.getElementById(buttonId);
            const loading = document.getElementById(loadingId);
            const text = document.getElementById(textId);

            if (isLoading) {
                button.disabled = true;
                loading.style.display = 'flex';
                text.style.display = 'none';
            } else {
                button.disabled = false;
                loading.style.display = 'none';
                text.style.display = 'flex';
            }
        }

        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            hideMessages();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }

            setLoading('loginBtn', 'loading', 'loginText', true);

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                } else {
                    showError(data.error || 'Login failed');
                }
            } catch (error) {
                showError('Network error. Please try again.');
            } finally {
                setLoading('loginBtn', 'loading', 'loginText', false);
            }
        });

        // Forgot password form submission
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            hideMessages();

            const email = document.getElementById('resetEmail').value.trim();

            if (!email) {
                showError('Please enter your email address');
                return;
            }

            setLoading('resetBtn', 'resetLoading', 'resetText', true);

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess(data.message);
                    setTimeout(() => {
                        closeForgotPassword();
                    }, 2000);
                } else {
                    showError(data.error || 'Failed to send reset link');
                }
            } catch (error) {
                showError('Network error. Please try again.');
            } finally {
                setLoading('resetBtn', 'resetLoading', 'resetText', false);
            }
        });

        // Form validation
        document.getElementById('email').addEventListener('blur', function () {
            const email = this.value.trim();
            if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                this.classList.add('error');
            } else {
                this.classList.remove('error');
            }
        });

        // Auto-focus on email field
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('email').focus();
        });
    </script>
</body>

</html>
