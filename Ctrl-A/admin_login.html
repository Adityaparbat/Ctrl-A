<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Ctrl-A</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #131314;
            --bg-surface: #1e1f20;
            --bg-surface-hover: #2d2e2f;
            --bg-input: #1e1f20;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-blue: #8ab4f8;
            --accent-blue-hover: #aecbfa;
            --border-color: #444746;
            --error-color: #f2b8b5;
            --success-color: #81c995;
            --focus-ring: #a8c7fa;
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Effect */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 15% 50%, rgba(138, 180, 248, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(138, 180, 248, 0.08), transparent 25%);
            z-index: -1;
            pointer-events: none;
        }

        .login-container {
            background: var(--bg-surface);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid var(--border-color);
            margin: 1rem;
        }

        .admin-icon {
            width: 80px;
            height: 80px;
            background: rgba(138, 180, 248, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 2rem;
            color: var(--accent-blue);
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-size: 2rem;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 3rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.2);
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-group input:focus+.input-icon {
            color: var(--accent-blue);
        }

        .btn {
            width: 100%;
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--accent-blue-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(138, 180, 248, 0.3);
        }

        .btn:disabled {
            background: var(--bg-surface-hover);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--accent-blue);
        }

        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert-error {
            background: rgba(242, 184, 181, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(242, 184, 181, 0.2);
        }

        .alert-success {
            background: rgba(129, 201, 149, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(129, 201, 149, 0.2);
        }

        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top: 2px solid #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .credentials-info {
            background: rgba(138, 180, 248, 0.05);
            border: 1px solid rgba(138, 180, 248, 0.1);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: left;
        }

        .credentials-info strong {
            color: var(--accent-blue);
        }

        .credentials-info code {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.1rem 0.3rem;
            border-radius: 4px;
            font-family: monospace;
            color: var(--text-primary);
        }

        /* Accessibility Focus Indicators */
        :focus-visible {
            outline: 3px solid var(--focus-ring);
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="admin-icon">
            <i class="fas fa-shield-alt"></i>
        </div>

        <h1>Admin Access</h1>
        <p class="subtitle">Enter admin credentials to manage welfare schemes</p>

        <div class="credentials-info">
            <div
                style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; color: var(--accent-blue);">
                <i class="fas fa-info-circle"></i>
                <strong>Default Credentials</strong>
            </div>
            Username: <code>admin</code><br>
            Password: <code>password</code>
        </div>

        <div id="alertContainer"></div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" required placeholder="Enter admin username"
                        aria-label="Username">
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" required placeholder="Enter admin password"
                        aria-label="Password">
                    <i class="fas fa-lock input-icon"></i>
                </div>
            </div>

            <button type="submit" class="btn" id="loginBtn">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <span>Signing in...</span>
                </div>
                <span id="btnText">Sign In as Admin</span>
            </button>
        </form>

        <a href="/landing" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to Landing Page
        </a>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loading = document.getElementById('loading');
            const btnText = document.getElementById('btnText');

            // Show loading state
            loginBtn.disabled = true;
            loading.style.display = 'flex';
            btnText.style.display = 'none';

            try {
                // Match the server IP/port or use localhost:8002
                const apiHost = `http://${window.location.hostname}:8002`;

                // Use the API endpoint for admin login
                let response;

                try {
                    response = await fetch(`${apiHost}/api/v1/admin/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    });
                } catch (err) {
                    console.warn("Primary API failed, trying fallback", err);
                    response = await fetch('/api/admin/login-session', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                }

                const data = await response.json();

                if (response.ok || data.success) {
                    // Store token if available
                    if (data.access_token) {
                        localStorage.setItem('adminToken', data.access_token);
                    }

                    showAlert('Login successful! Redirecting to admin panel...', 'success');

                    // Also ensure session login for flask backend
                    try {
                        await fetch('/api/admin/login-session', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, password })
                        });
                    } catch (_) { }

                    setTimeout(() => {
                        window.location.href = '/admin_schemes';
                    }, 1000);
                } else {
                    showAlert(data.message || data.error || 'Invalid credentials. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Network error. Please try again.', 'error');
            } finally {
                // Hide loading state
                loginBtn.disabled = false;
                loading.style.display = 'none';
                btnText.style.display = 'inline';
            }
        });

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            const icon = type === 'success' ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-exclamation-circle"></i>';
            alert.innerHTML = `${icon} <span>${message}</span>`;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);

            // Auto-hide after 5 seconds
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        // Auto-fill credentials for testing
        document.addEventListener('DOMContentLoaded', function () {
            // Uncomment the next two lines to auto-fill credentials for testing
            // document.getElementById('username').value = 'admin';
            // document.getElementById('password').value = 'password';
        });
    </script>
</body>

</html>
